[package]
name = "termvisor"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "GPL-3.0-or-later"
description = "Multi-protocol terminal and remote access tool"
readme = "README.md"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
vte = { package = "vte4", version = "0.10", features = ["v0_76"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
libsecret = "0.9"
serialport = "4.10"
async-channel = "2"

[build-dependencies]
glib-build-tools = "0.22"

[profile.release]
lto = true
codegen-units = 1
strip = true
