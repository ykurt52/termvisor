[package]
name = "termvisor"
version = "1.0.6"
edition = "2021"
rust-version = "1.92"
license = "GPL-3.0-or-later"
description = "Multi-protocol terminal and remote access tool"
readme = "README.md"
authors = ["Yunus Kurt <yunuskkurt@gmail.com>"]
homepage = "https://github.com/ykurt52/termvisor"
repository = "https://github.com/ykurt52/termvisor"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
serialport = "4.10"
async-channel = "2"
libc = "0.2"
regex = "1"
mavlink = { version = "0.21", default-features = false, features = ["std", "dialect-common", "mav2-message-extensions"] }
suppaftp = { version = "12", features = ["native-tls"] }
zmodem2 = "0.7"
alacritty_terminal = "0.26"
native-tls = "0.2"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libsecret = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Devices_Communication",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[build-dependencies]
glib-build-tools = "0.22"
embed-resource = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true

# Debian package: cargo deb (after cargo build --release). See docs/packaging.md.
[package.metadata.deb]
maintainer = "Yunus Kurt <yunuskkurt@gmail.com>"
copyright = "2026, Yunus Kurt"
license-file = ["LICENSE", "0"]
section = "net"
priority = "optional"
depends = "$auto, openssh-client"
recommends = "iputils-ping, iputils-tracepath"
suggests = "mosh, adb"
extended-description = """\
termvisor puts the connections of embedded and network work into one \
window with tabs and split panes: local shells, SSH, mosh, serial ports, \
raw TCP, telnet, FTP and Android devices. It adds serial file transfers \
(XMODEM, YMODEM, ZMODEM), an SFTP/FTP file panel, command buttons, \
macros, multi-exec, SSH tunnels, TFTP and HTTP servers, a port scanner, \
passive USB capture and a theme editor."""
assets = [
    ["target/release/termvisor", "usr/bin/", "755"],
    ["data/io.github.ykurt52.termvisor.desktop", "usr/share/applications/", "644"],
    ["data/io.github.ykurt52.termvisor.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/icons/hicolor/scalable/apps/io.github.ykurt52.termvisor.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["README.md", "usr/share/doc/termvisor/", "644"],
    ["docs/*.md", "usr/share/doc/termvisor/docs/", "644"],
]
