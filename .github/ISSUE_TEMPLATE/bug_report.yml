name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a security problem, do not use this form:
        report it privately (Security → Report a vulnerability).
  - type: input
    id: version
    attributes:
      label: termvisor version
      description: Menu → About termvisor.
      placeholder: "1.0.6"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How termvisor is installed
      options:
        - Windows installer (setup.exe)
        - Windows portable exe
        - Debian/Ubuntu package (.deb or APT)
        - Arch Linux (AUR)
        - Built from source
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system
      placeholder: "Windows 11 24H2, Ubuntu 24.04, ..."
    validations:
      required: true
  - type: dropdown
    id: session
    attributes:
      label: Session kind
      description: Where the problem shows up.
      multiple: true
      options:
        - Serial
        - SSH
        - Local shell
        - Telnet
        - Raw TCP
        - FTP / SFTP / files
        - Android (adb)
        - USB capture
        - Plot
        - Tools (ping, TFTP, HTTP, scan)
        - Window, tabs, settings
        - Install or update
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a serial session on COM3 at 115200
        2. ...
  - type: textarea
    id: details
    attributes:
      label: Troubleshooting details
      description: Menu → About termvisor → Troubleshooting → copy, and paste it here.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Log or screenshot
      description: A session log, terminal output or a screenshot, if it helps.
