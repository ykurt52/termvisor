name: Release

# Pushing a tag like v1.0.1 builds the .deb and the Windows zip and
# attaches them to a GitHub release with that name (the source tarball is
# added by GitHub).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Version matches the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          have="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test "$want" = "$have" || { echo "tag $GITHUB_REF_NAME but Cargo.toml has $have"; exit 1; }

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libsecret-1-dev libudev-dev pkg-config dpkg-dev

      - name: Rust toolchain
        run: |
          rustup toolchain install 1.92 --profile minimal
          rustup default 1.92

      - name: Build .deb
        run: |
          cargo build --release --locked
          cargo install cargo-deb --locked --version '^2'
          cargo deb --no-build

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" target/debian/*.deb --title "$GITHUB_REF_NAME" --generate-notes

  windows:
    needs: deb
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - uses: msys2/setup-msys2@v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-rust

      - name: Build and bundle
        shell: msys2 {0}
        run: |
          cargo build --release --locked
          packaging/windows/bundle.sh target/release/termvisor.exe dist/termvisor
          cd dist && zip -qr "termvisor-windows-x64_${GITHUB_REF_NAME}.zip" termvisor

      - name: Installer
        shell: pwsh
        run: packaging/windows/setup.ps1 ($env:GITHUB_REF_NAME.TrimStart('v')) dist/termvisor dist

      - name: Attach to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" (Get-Item dist/termvisor-windows-x64_v*.zip, dist/termvisor-windows-x64_v*_setup.exe)

  apt:
    needs: deb
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/apt.yml
    secrets: inherit
